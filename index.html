<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply the saved theme before first paint so a dark-mode visitor never sees the
         light theme flash and animate over. Key must match ThemeToggle.jsx. -->
    <script>
      try {
        var theme = localStorage.getItem('portfolio-theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Rishi Pisipati builds software for teachers, coaches and district leaders. Product engineer in EdTech: React, Spring Boot and LLMs, with a learning-science background from Carnegie Mellon."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='4' y='10' width='86' height='86' rx='24' fill='%234a4ae8'/><circle cx='84' cy='16' r='13' fill='%23ffe066' stroke='white' stroke-width='5'/><text x='47' y='68' font-family='Arial,sans-serif' font-weight='800' font-size='40' fill='white' text-anchor='middle'>RP</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Rishi Pisipati — Product Engineer, EdTech</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
