name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before the next starts; don't cancel a run mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Pages base path
        id: base
        run: |
          # A <user>.github.io repo is served from "/"; every other repo from "/<repo>/".
          # GITHUB_REPOSITORY ("owner/repo") is set for every event type, unlike the
          # event payload, so strip the owner off that.
          repo="${GITHUB_REPOSITORY#*/}"
          lower=$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')
          case "$lower" in
            *.github.io) path="/" ;;
            *)           path="/${repo}/" ;;
          esac
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "Repository '${repo}' resolves to base path '${path}'"

      - name: Build
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Add SPA fallback
        # GitHub Pages has no server-side rewrite, so deep links like /experience
        # are served from 404.html — the router then renders the right page.
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
